  <title>水蓝 API · 登录页主视觉</title>
  <style>
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #fff; }
    body { display: grid; place-items: center; }
    canvas { display: block; width: 100%; height: 100%; opacity: 0; }
    #fallback { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; background: #fff; }
    #fallback[hidden] { display: none; }
    #error { display: none; max-width: 30em; padding: 24px; color: #4d6268; font: 15px/1.7 system-ui, sans-serif; }
    canvas { touch-action:none; cursor:grab; }

    #drag-hint { position:absolute;left:16px;bottom:12px;margin:0;max-width:calc(100% - 120px);color:#8ca9bd;font:12px/1.8 system-ui,sans-serif;pointer-events:none; }

    #drag-hint[data-limited="true"] { color:#aaa; }

    #motion { position:absolute; right:16px; bottom:14px; border:1px solid #dfedf6; border-radius:18px; padding:7px 12px; background:#fff; color:#6793b2; font:12px/1.4 system-ui,sans-serif; cursor:pointer; }

    #motion[hidden] { display:none; }

    #motion:hover { color:#247db7; border-color:#b3d8ef; }

    #motion:focus-visible { outline:2px solid #349fdf; outline-offset:3px; }

    #static-fallback { position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(100vw,123.076923vh);aspect-ratio:1920 / 1560;pointer-events:none; }
    #static-fallback[hidden] { display:none; }
    #fallback:not([hidden]) { --breath-scale:1.027;animation:water-breathe 8.6s ease-in-out infinite;transform-origin:50% 50%; }
    #static-fallback > span { position:absolute;background-image:var(--droplet-atlas);background-size:500% 100%;background-repeat:no-repeat;opacity:0;--breath-scale:1.165;transform-origin:50% 50%;animation:bead-appear 1s ease-out var(--delay) forwards,water-breathe var(--breath-duration) ease-in-out var(--breath-delay) infinite;animation-play-state:inherit; }
    @keyframes bead-appear { from {opacity:0} to {opacity:1} }
    @keyframes water-breathe { 0%,100% {transform:scale(1)} 50% {transform:scale(var(--breath-scale))} }



  </style>

    gl.texParameteri(gl.TEXTURE_CUBE_MAP,gl.TEXTURE_MAG_FILTER,gl.LINEAR);
    for(const axis of [gl.TEXTURE_WRAP_S,gl.TEXTURE_WRAP_T,gl.TEXTURE_WRAP_R])gl.texParameteri(gl.TEXTURE_CUBE_MAP,axis,gl.CLAMP_TO_EDGE);
    gl.uniform1i(gl.getUniformLocation(program,'environmentMap'),1);
    const postTexture=texture();gl.activeTexture(gl.TEXTURE2);gl.bindTexture(gl.TEXTURE_2D,postTexture);
    for(const [key,value] of [[gl.TEXTURE_MIN_FILTER,gl.LINEAR],[gl.TEXTURE_MAG_FILTER,gl.LINEAR],[gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE],[gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE]])gl.texParameteri(gl.TEXTURE_2D,key,value);
    const target=gl.createFramebuffer();objects.targets.push(target);
    let width=0,height=0,frames=0;
    timings.readyMs=performance.now()-started;
    return{canvas,timings,dispose,
      onLoss(callback){lossCallback=callback;},
      get stats(){return{frames,width,height};},
      render(frame){
        if(disposed)return;
        gl.useProgram(program);gl.bindFramebuffer(gl.FRAMEBUFFER,target);
        if(width!==frame.width||height!==frame.height){
          width=frame.width;height=frame.height;canvas.width=width;canvas.height=height;
          gl.activeTexture(gl.TEXTURE2);gl.bindTexture(gl.TEXTURE_2D,postTexture);
          gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,width,height,0,gl.RGBA,gl.UNSIGNED_BYTE,null);
          gl.framebufferTexture2D(gl.FRAMEBUFFER,gl.COLOR_ATTACHMENT0,gl.TEXTURE_2D,postTexture,0);
          if(gl.checkFramebufferStatus(gl.FRAMEBUFFER)!==gl.FRAMEBUFFER_COMPLETE)throw new Error('Antialias target unavailable.');
        }
        gl.viewport(0,0,width,height);gl.uniform2f(uniforms.resolution,width,height);
        gl.uniform4fv(uniforms.viewWindow,frame.viewWindow);
        gl.uniform1f(uniforms.time,frame.time);gl.uniform1f(uniforms.surfaceTime,frame.surfaceTime);
        gl.uniform1i(uniforms.surfaceClockEnabled,1);gl.uniform2fv(uniforms.pointer,frame.pointer);
        gl.uniform3fv(uniforms.bodyShape,frame.bodyShape);gl.uniform2fv(uniforms.bodyWarp,frame.bodyWarp);
        gl.uniform1i(uniforms.beadCount,frame.beadCount);
        for(const name of arrays)gl.uniform4fv(uniforms[name],frame[name]);
        gl.uniform4fv(uniforms.waveEnergy,frame.waveEnergy);gl.drawArrays(gl.TRIANGLES,0,3);
        gl.bindFramebuffer(gl.FRAMEBUFFER,null);gl.useProgram(postProgram);
        gl.activeTexture(gl.TEXTURE2);gl.bindTexture(gl.TEXTURE_2D,postTexture);
        gl.uniform1i(postUniforms.scene,2);gl.uniform2f(postUniforms.resolution,width,height);gl.drawArrays(gl.TRIANGLES,0,3);
        if(frames===0&&gl.getError()!==gl.NO_ERROR)throw new Error('Initial GPU drawing failed.');
        frames++;
      }
    };
  }catch(error){dispose();throw error;}
  finally{normalImage?.close?.();environmentImage?.close?.();}
}

function waterGPUWorker(){
  let renderer;
  self.onmessage=async event=>{
    const message=event.data;
    try{
      if(message.type==='init'){
        renderer=await createWaterGPURenderer(message.canvas,message.assets);
        renderer.onLoss(error=>self.postMessage({type:'error',error:error.message}));
        self.postMessage({type:'ready',timings:renderer.timings});
      }else if(message.type==='render'){
        renderer.render(message.frame);self.postMessage({type:'frame',stats:renderer.stats});
      }else if(message.type==='capture'){
        self.postMessage({type:'capture',blob:await renderer.canvas.convertToBlob({type:'image/png'})});
      }
    }catch(error){self.postMessage({type:'error',error:String(error?.message||error)});}
  };
}

// At most one frame in flight and one newest pending frame. No worker rAF,
// duplicate simulation, bitmap readback or per-frame image transfers.
window.createWaterRenderDriver=async function(inputCanvas,assets,onError,options={}){
  const renderingCanvas=document.createElement('canvas');
  let worker,sourceURL,disposed=false,active=true,busy=false,pending=null,stats={frames:0,width:0,height:0};
  const captureWaiters=[];
  let pendingBuffer;
  function snapshot(frame){
    if(!pendingBuffer){
      pendingBuffer={};for(const [key,value] of Object.entries(frame))pendingBuffer[key]=ArrayBuffer.isView(value)?value.slice():value;
    }else for(const [key,value] of Object.entries(frame)){
      if(ArrayBuffer.isView(value))pendingBuffer[key].set(value);else pendingBuffer[key]=value;
    }
    return pendingBuffer;
  }
  let resolveFirstFrame;
  const firstFrame=new Promise(resolve=>{resolveFirstFrame=resolve;});
  function destroyWorker(){
    if(disposed)return;disposed=true;worker?.terminate();
    if(sourceURL)URL.revokeObjectURL(sourceURL);renderingCanvas.remove();
    for(const waiter of captureWaiters)waiter.reject(new Error('Renderer disposed.'));captureWaiters.length=0;
  }
  let workerFailure='';
  if(!options.preferMainThread&&typeof Worker==='function'&&typeof renderingCanvas.transferControlToOffscreen==='function'){
    try{
      renderingCanvas.setAttribute('aria-hidden','true');renderingCanvas.style.pointerEvents='none';
      renderingCanvas.style.position='absolute';renderingCanvas.style.opacity='0';inputCanvas.before(renderingCanvas);
      sourceURL=URL.createObjectURL(new Blob([createWaterGPURenderer.toString(),'\n(',waterGPUWorker.toString(),')();'],{type:'text/javascript'}));
      worker=new Worker(sourceURL);
      const offscreen=renderingCanvas.transferControlToOffscreen();
      const timings=await new Promise((resolve,reject)=>{
        const timer=setTimeout(()=>reject(new Error('Background GPU initialization timed out.')),45000);
        worker.onerror=event=>{clearTimeout(timer);reject(new Error(event.message||'Background GPU unavailable.'));};
        worker.onmessage=event=>{
          if(event.data.type==='ready'){clearTimeout(timer);resolve(event.data.timings);}
          if(event.data.type==='error'){clearTimeout(timer);reject(new Error(event.data.error));}
        };
        worker.postMessage({type:'init',canvas:offscreen,assets},[offscreen]);
      });
      worker.onerror=event=>onError(new Error(event.message||'Background GPU failed.'));
      worker.onmessage=event=>{
        const message=event.data;
        if(message.type==='error'){onError(new Error(message.error));return;}
        if(message.type==='capture'){captureWaiters.shift()?.resolve(message.blob);return;}
        if(message.type!=='frame')return;
        stats=message.stats;busy=false;renderingCanvas.style.opacity='1';resolveFirstFrame();
        if(pending&&active){const frame=pending;pending=null;busy=true;worker.postMessage({type:'render',frame});}
      };
      return{canvas:renderingCanvas,backend:'webgl2-worker',timings,firstFrame,
        get stats(){return stats;},dispose:destroyWorker,
        setActive(value){active=value;if(!active)pending=null;},
        render(frame){
          if(disposed||!active)return;
          if(busy){pending=snapshot(frame);return;}
          busy=true;worker.postMessage({type:'render',frame});
        },
        capture(){return new Promise((resolve,reject)=>{captureWaiters.push({resolve,reject});worker.postMessage({type:'capture'});});}
      };
    }catch(error){workerFailure=String(error?.message||error);destroyWorker();/* Retry the same full material on the main thread. */}
  }
  const renderer=await createWaterGPURenderer(inputCanvas,assets);renderer.onLoss(onError);
  if(workerFailure)renderer.timings.workerFailure=workerFailure;
  return{...renderer,backend:'webgl2',get stats(){return renderer.stats;},setActive(){},
    async capture(){return new Promise(resolve=>inputCanvas.toBlob(resolve,'image/png'));}};
};

    beads.forEach((bead,i)=>{
      if(!bead||bead.mode==='merging'||bead.mode==='dissolving'||bead.mode==='coalescing'||bead.radius<.015)return;
      const t=dropletIntersection(bead,ray);
      if(t>0&&t<nearest){nearest=t;index=i;}
    });
    return index;
  }
  function moveGesture(point){
    if(gesture.mode==='armed'){
      const bead=beads[gesture.bead];if(!bead)return;
      if(length(sub(worldPoint(point),bead.dragStart))>.001)bead.dragMoved=true;
      const destination=dragPosition(bead,point);
      if(mainIntersection(point).hit){bead.position=destination;gesture.last=point;return;}
      const anchor=boundaryBetween(gesture.last,point);
      bead.anchor=anchor;bead.mode='attached';bead.link=1;
      bead.dragSample=[...bead.position];
      gesture.mode='bead';counters.emerged++;
      emitWave(anchor,.13+bead.radius);
    }
    if(gesture.mode!=='bead')return;
    const bead=beads[gesture.bead];if(!bead)return;
    bead.dragTarget=dragPosition(bead,point);bead.lastPointTime=performance.now();
    bead.dragReenter=mainIntersection(point).hit;
    gesture.last=point;
  }
  addEventListener('pointermove',event=>{
    if(gesture.id!==null){
      if(event.pointerId!==gesture.id)return;
      const samples=typeof event.getCoalescedEvents==='function'?event.getCoalescedEvents():[];
      // Preserve curved pointer paths: the last inside sample determines the exit segment.
      for(const sample of samples.length?samples:[event])moveGesture({x:sample.clientX,y:sample.clientY});
      schedule();return;
    }
    if(!reduced.matches){
      pointer.targetX=clamp((event.clientX/innerWidth-.5)*2,-1,1);
      pointer.targetY=clamp((.5-event.clientY/innerHeight)*2,-1,1);schedule();
    }
  },{passive:true});
  canvas.style.touchAction='none';
  canvas.addEventListener('pointerdown',event=>{
    if(!ready||dead||gesture.id!==null||event.button!==0)return;
    const point={x:event.clientX,y:event.clientY};let index=beadUnderPointer(point);
    if(index>=MANUAL_BEADS){
      const slot=beads.findIndex((bead,i)=>i<MANUAL_BEADS&&!bead);
      if(slot<0)return;
      beads[slot]=beads[index];beads[index]=null;index=slot;beads[index].kind='interactive';
    }
    const mainHit=index<0?mainIntersection(point):null;
    if(index<0&&!mainHit.hit)return;
    const bornInside=index<0;
    if(bornInside){
      // Use the near visible surface, not the drag plane or the silhouette anchor.
      // Emit before the capacity check so clicking a full main sphere still responds.
      emitWave(add(mainHit.origin,mul(mainHit.direction,mainHit.near)),.94);counters.clicks++;
      event.preventDefault();draw();schedule();
      if(!interactionReady)return;
      index=beads.findIndex((bead,i)=>i<MANUAL_BEADS&&!bead);
      if(index<0){counters.capacityHits++;return;}
      const radius=randomRadius(),start=worldPoint(point),center=safelyInside(start,radius*1.16);
      const bead=newBead('interactive',center,radius,surfaceAt(center),'internal');
      bead.radius=0;bead.growAge=0;bead.dragStart=start;bead.dragOffset=sub(start,center);
      bead.lastPointTime=performance.now();beads[index]=bead;counters.created++;
    }
    event.preventDefault();gesture.id=event.pointerId;gesture.last=point;
    gesture.bead=index;gesture.mode=bornInside?'armed':'bead';
    if(!bornInside){
      const bead=beads[index];
      if(bead.mode==='ambient')bead.mode='detached';
      if(bead.mode==='homing')bead.mode='detached';
      if(bead.mode==='returning')bead.mode='attached';
      bead.lastPointTime=performance.now();
      bead.dragOffset=null;bead.dragStart=null;
      bead.grabOffset=sub(worldPoint(point),bead.position);
      bead.dragTarget=[...bead.position];bead.dragSample=[...bead.position];bead.dragReenter=false;
    }
    pointer.targetX=pointer.x;pointer.targetY=pointer.y;
    try{canvas.setPointerCapture(event.pointerId);}catch(_){/* Window-level release remains available. */}
    canvas.style.cursor='grabbing';schedule();
  });
  function release(event={}){
    if(gesture.id===null||(event.pointerId!==undefined&&event.pointerId!==gesture.id))return;
    const id=gesture.id,bead=beads[gesture.bead];
    gesture.id=null;gesture.mode='idle';gesture.bead=-1;gesture.last=null;
    if(bead){
      bead.dragTarget=null;bead.dragSample=null;bead.dragReenter=false;
      if(bead.mode==='internal'||(bead.mode==='attached'&&mainGap(bead.position)<-bead.baseRadius*1.16)){
        dissolveInternal(bead);
      }else if(bead.mode==='attached'){
        bead.mode='returning';bead.velocity=mul(bead.velocity,.45);
        emitWave(bead.anchor,.2+Math.min(.7,length(sub(bead.position,bead.anchor))));
      }else if(bead.mode==='detached'||bead.mode==='pinching'){
        // Detached beads retain a little hand momentum, then accelerate gently home.
        bead.velocity=mul(bead.velocity,.28);
        if(bead.mode==='detached')bead.mode='homing';
        if(mainGap(bead.position)<bead.baseRadius*.70)startMerge(bead);
      }
    }
    try{if(canvas.hasPointerCapture(id))canvas.releasePointerCapture(id);}catch(_){}
    canvas.style.cursor='grab';schedule();
  }
  canvas.addEventListener('pointerup',release);
  canvas.addEventListener('pointercancel',release);
  canvas.addEventListener('lostpointercapture',release);
  addEventListener('pointerup',release);
  addEventListener('pointercancel',release);
  addEventListener('blur',release);
  document.addEventListener('pointerleave',()=>{if(gesture.id===null){pointer.targetX=pointer.targetY=0;schedule();}});
  let resizeTimer;
  addEventListener('resize',()=>{clearTimeout(resizeTimer);resizeTimer=setTimeout(()=>{resizeNeeded=true;draw();schedule();},150);});
  document.addEventListener('visibilitychange',()=>{
    if(document.hidden)release({});
    resetRenderProgress();
    renderDriver?.setActive(visible&&!document.hidden);
    updateButton();
    if(document.hidden){cancelTick();}
    else {lastStamp=lastRenderedStamp=0;schedule();}
  });
  if('IntersectionObserver'in window)new IntersectionObserver(entries=>{
    visible=entries[0].isIntersecting;
    resetRenderProgress();
    renderDriver?.setActive(visible&&!document.hidden);
    updateButton();
    if(!visible){cancelTick();}else schedule();
  }).observe(document.documentElement);
  function restoreForeground(){
    if(document.hidden)return;
    // Embedded panels may be recreated or shown from a back/forward cache
    // without delivering their usual visibility/IntersectionObserver update.
    const rect=canvas.getBoundingClientRect();
    visible=rect.width>0&&rect.height>0&&rect.left<innerWidth&&rect.top<innerHeight&&
      rect.left+rect.width>0&&rect.top+rect.height>0;
    renderDriver?.setActive(visible);
    updateButton();
    resetRenderProgress();lastStamp=lastRenderedStamp=0;resizeNeeded=true;schedule();
  }
  addEventListener('pageshow',restoreForeground);
  addEventListener('focus',restoreForeground);
  canvas.addEventListener('webglcontextrestored',()=>{if(dead)void initialize();});
  window.waterBall={settings,
    pause(){paused=true;updateButton();},
    resume(){paused=false;updateButton();schedule();},
    setTime(value){const t=Number(value);if(Number.isFinite(t)){simTime=t;surfaceTime=t;}draw();},
    render:draw,
    get state(){return{ready,paused,fallback:dead,loading,lastError,drawCount,lastDrawMs,backend,recoveryReason,staticFallback:dead,renderedFrames:renderDriver?.stats.frames||0,
      stage,interactionReady,flowEnabled,surfaceTime,enhancementError,startupTimings:{...startupTimings},gpuBeadCount,time:simTime,width:renderWidth,height:renderHeight,renderCrop,
      capacity:{interactive:MANUAL_BEADS,ambient:MAX_BEADS-MANUAL_BEADS},gesture:{...gesture},counters:{...counters},
      camera:{pointer:[pointer.x,pointer.y],shape:shape(),warp:warp()},
      body:{shape:shape(),warp:warp(),modes:[...body.modes],velocity:[...body.velocity],target:[...body.target],impulses:body.impulses},
      beads:beads.map((b,index)=>b?{index,id:b.id,kind:b.kind,mode:b.mode,position:[...b.position],velocity:[...b.velocity],
        radius:b.radius,baseRadius:b.baseRadius,anchor:[...b.anchor],link:b.link,detachLimit:b.detachLimit,appearance:[...b.appearance],
        mergeAge:b.mergeAge,recontacts:b.mergeTouchdowns||0,
        fusionTarget:b.fusionTarget||null,fusionAge:b.fusionAge||0,shape:dropletShape(b),stretch:[...(b.inertiaAxis||[1,0,0]),b.inertiaAmount||0],
        dragTarget:b.dragTarget?[...b.dragTarget]:null}:null),
      waves:waves.map(w=>({origin:[...w.origin],age:w.age,energy:w.energy}))};},
    async savePNG(){if(!ready)return;draw();const blob=await renderDriver.capture();if(!blob)return;const url=URL.createObjectURL(blob),a=document.createElement('a');a.download='water-ball.png';a.href=url;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);}
  };
  updateButton();
  setTimeout(initialize,0);
})();
</script>
