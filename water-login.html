<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>API Relay · 登录页展示方案</title>
  <style>
    :root{font-family:Inter,"Segoe UI","Microsoft YaHei",sans-serif;color:#18344e;background:white;font-synthesis:none}
    *{box-sizing:border-box}body{margin:0}button,input{font:inherit}button,a{touch-action:manipulation}button{cursor:pointer}a{color:#248dca;text-decoration:none}a:hover{text-decoration:underline}
    .page{min-height:100svh;display:grid;grid-template-columns:minmax(0,1.18fr) minmax(400px,0.82fr)}
    .showcase{min-width:0;position:relative;display:flex;flex-direction:column;justify-content:center;padding:78px 48px 42px;border-right:1px solid #eef3f6;overflow:hidden}
    .brand{position:absolute;top:32px;left:42px;display:flex;align-items:center;gap:10px;letter-spacing:-.5px;color:#173c59;font-size:20px;font-weight:650}
    .mark{width:29px;height:32px;border:2px solid #32a6e5;border-radius:45% 55% 48% 52%;display:grid;place-items:center;color:#32a6e5;font-size:17px}
    .intro{max-width:620px;width:100%;margin:35px auto 0;position:relative;z-index:1}
    .eyebrow{font:11px/1.5 Consolas,monospace;letter-spacing:3px;color:#6f9bb8;margin:0 0 17px}
    h1{font-size:clamp(27px,2.55vw,40px);line-height:1.4;letter-spacing:-1.5px;font-weight:600;margin:0}
    .intro p:last-child{font-size:14px;line-height:1.8;color:#7a91a3;margin:14px 0 0}
    .art{height:clamp(370px,53vh,650px);width:calc(100% + 70px);margin:0 -35px;border:0;display:block;background:#fff}
    .caption{font:11px/1.5 Consolas,monospace;letter-spacing:2px;color:#8ea7b9;text-align:center;margin:0 0 18px}
    .login-side{padding:40px 56px;display:flex;flex-direction:column;justify-content:center;position:relative}
    .layout-note{position:absolute;right:32px;top:32px;color:#9aaab6;font-size:12px}
    .form{width:100%;max-width:350px;margin:auto}
    .welcome{font-size:30px;letter-spacing:-1px;line-height:1.3;font-weight:600;margin:0 0 13px}.sub{color:#8294a2;font-size:14px;line-height:1.8;margin:0 0 34px}
    label{display:block;font-size:13px;color:#3e566a;margin:19px 0 9px}
    input{width:100%;height:48px;padding:0 14px;border:1px solid #dfE7ed;border-radius:8px;background:#fff;color:#264359;outline-offset:3px;font-size:14px}
    input::placeholder{color:#b4c0ca}input:focus{outline:2px solid #8acff1;border-color:#8acff1}
    .primary{width:100%;height:48px;border:0;border-radius:8px;background:#249bda;color:white;margin-top:27px;font-size:14px;font-weight:500}.primary:hover{background:#198ac5}
    .footnote{font-size:12px;line-height:1.8;color:#97a8b5;margin:18px 0 0}.info{min-height:40px;color:#4783a9;font-size:12px;line-height:1.7;margin-top:16px}
    .small-link{position:absolute;bottom:28px;right:32px;font-size:12px;color:#8aa5b6}
    @media(min-width:1600px){.showcase{padding-left:100px;padding-right:100px}.login-side{padding:70px}}
    @media(max-width:1000px){.page{grid-template-columns:minmax(0,1fr) 400px}.showcase{padding:95px 24px 40px}.intro{margin-top:15px}.brand{left:25px}.intro p:last-child{font-size:13px}.login-side{padding:75px 38px 45px}.art{width:calc(100% + 48px);margin:0 -24px;height:400px}}
    @media(max-width:760px){.page{display:block}.showcase{border-right:0;padding:90px 24px 0;min-height:0}.brand{top:25px}.intro{margin:0 auto;text-align:center}h1{font-size:29px}.intro p:last-child{margin-top:10px}.art{height:350px;width:100%;margin:0}.caption{display:none}.login-side{padding:18px 28px 70px}.layout-note{display:none}.form{max-width:380px}.welcome{font-size:25px}.sub{margin-bottom:25px}.small-link{bottom:24px}}
    @media(max-width:400px){.showcase{padding-left:15px;padding-right:15px}.art{height:290px}h1{font-size:26px}.intro p:last-child{font-size:12px}}
  </style>
</head>
<body>
  <main class="page">
    <section class="showcase" aria-label="API 中转站水球主视觉">
      <div class="brand"><span class="mark" aria-hidden="true">≈</span>API Relay</div>
      <div class="intro">
        <p class="eyebrow">ONE CONNECTION. MORE POSSIBILITIES.</p>
        <h1>一个入口，连接更多模型。</h1>
        <p>让应用与智能之间的连接，简单、清晰。</p>
      </div>
      <iframe class="art" src="water-ball.html?v=water-breathe-30" title="纯白背景上的清透水蓝色水球" loading="eager"></iframe>
      <p class="caption">LANGUAGE &nbsp; / &nbsp; VISION &nbsp; / &nbsp; AUDIO</p>
    </section>
    <section class="login-side" aria-label="登录表单视觉示例">
      <span class="layout-note">登录页展示方案</span>
      <form class="form" id="demo-form">
        <h2 class="welcome">欢迎回来</h2>
        <p class="sub">登录控制台，开始你的下一次调用。</p>
        <label for="email">邮箱地址</label>
        <input id="email" type="email" placeholder="you@example.com" autocomplete="off" aria-describedby="demo-note">
        <label for="password">密码</label>
        <input id="password" type="password" placeholder="请输入密码" autocomplete="off" aria-describedby="demo-note">
        <button class="primary" type="submit">登录</button>
        <p class="footnote" id="demo-note">此页面为布局展示，表单不发送或保存信息。</p>
        <p class="info" id="demo-message" role="status" aria-live="polite"></p>
      </form>
      <a class="small-link" href="water-ball.html">单独查看水球主视觉 ↗</a>
    </section>
  </main>
  <script>
    document.getElementById('demo-form').addEventListener('submit', event => {
      event.preventDefault();
      document.getElementById('demo-message').textContent='这是登录页布局预览，尚未连接认证服务。';
    });
  </script>
</body>
</html>
